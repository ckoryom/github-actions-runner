name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hadolint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Run hadolint
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile.alpine-podman
          failure-threshold: warning

  shellcheck:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: "."
          severity: warning

  build-check-alpine-podman:
    name: Build Podman image (amd64, no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build Podman image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.alpine-podman
          platforms: linux/amd64
          push: false
          load: true
          tags: podman-actions-runner:ci-alpine-podman
      - name: Smoke test (runner + Buildah + Node 24+/pnpm prerequisites)
        run: |
          docker run --rm --user runner --entrypoint bash podman-actions-runner:ci-alpine-podman \
            -c "command -v buildah >/dev/null \
              && buildah --version \
              && node -e 'const major = Number(process.versions.node.split(\".\")[0]); if (major < 24) process.exit(1)' \
              && npm --version \
              && rm -rf /tmp/pnpm-smoke && mkdir -p /tmp/pnpm-smoke && cd /tmp/pnpm-smoke \
              && npm install --silent pnpm@10.20.0 \
              && ./node_modules/.bin/pnpm --version \
              && ./node_modules/.bin/pnpm store path --silent >/dev/null \
              && cd /home/runner/actions-runner \
              && ./config.sh --help \
              && ./run.sh --version"
