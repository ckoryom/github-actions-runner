name: Build and Publish

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      runner_version:
        description: "actions/runner version to bake into the image (e.g. 2.321.0)"
        required: false
        type: string

permissions:
  contents: read

env:
  DOCKERHUB_IMAGE: docker.io/ckoryom/podman-actions-runner
  DOCKERHUB_REPOSITORY: ckoryom/podman-actions-runner
  GHCR_IMAGE: ghcr.io/ckoryom/podman-actions-runner

jobs:
  build-and-publish:
    name: Build, scan, sign, and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # required for keyless cosign signing
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine runner version
        id: runner_version
        run: |
          if [ -n "${{ github.event.inputs.runner_version }}" ]; then
            version="${{ github.event.inputs.runner_version }}"
          else
            version="$(grep -m1 '^ARG RUNNER_VERSION=' Dockerfile.alpine-podman | cut -d= -f2)"
          fi
          echo "value=${version}" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=podman-actions-runner
            org.opencontainers.image.description=Community-maintained Alpine + Podman self-hosted GitHub Actions runner with fresh registration tokens on every start.
            org.opencontainers.image.url=https://github.com/ckoryom/podman-actions-runner
            org.opencontainers.image.documentation=https://github.com/ckoryom/podman-actions-runner#readme
            org.opencontainers.image.source=https://github.com/ckoryom/podman-actions-runner

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.alpine-podman
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ github.event.inputs.runner_version && format('RUNNER_VERSION={0}', github.event.inputs.runner_version) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: "${{ env.DOCKERHUB_IMAGE }}@${{ steps.build.outputs.digest }}"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: Run Trivy vulnerability scan (GHCR)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: "${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign image (keyless, OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            "${{ env.DOCKERHUB_IMAGE }}@${{ steps.build.outputs.digest }}"
          cosign sign --yes \
            "${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}"

      - name: Attest build provenance (Docker Hub)
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-name: ${{ env.DOCKERHUB_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest build provenance (GHCR)
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Update Docker Hub repository description
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_REPOSITORY }}
