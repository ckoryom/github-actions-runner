name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Open/maintain release PR
    runs-on: ubuntu-latest
    steps:
      - name: Ensure RELEASE_PLEASE_TOKEN is configured
        run: |
          if [ -z "${{ secrets.RELEASE_PLEASE_TOKEN }}" ]; then
            echo "RELEASE_PLEASE_TOKEN is required so release tags are created with a PAT and can trigger downstream publish workflows."
            exit 1
          fi

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
