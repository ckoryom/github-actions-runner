name: podman-e2e-smoke-test
on:
  push:
    branches: [podman-alpine-spike]
jobs:
  smoke:
    runs-on: [self-hosted, podman-alpine-spike-test]
    steps:
      - uses: actions/checkout@v4
      - name: shell step
        run: echo "hello from podman alpine runner" && uname -a
      - name: nested docker/podman build
        run: |
          mkdir -p /tmp/nested-build
          cd /tmp/nested-build
          printf 'FROM alpine:3.20\nRUN echo nested-build-ok\n' > Dockerfile
          docker build -t nested-test .
